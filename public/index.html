<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🛒 Mag-order na Dito!</h1>

    <!-- 📢 Announcement -->
    <div id="announcement" class="announcement-banner" style="display:none;"></div>

    <!-- 🟢🔴 Shop Status -->
    <div id="shop-status" class="status-banner"></div>

    <!-- 📑 Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="signatures">Signatures</button>
      <button class="tab-btn" data-tab="flavored">Flavored</button>
      <button class="tab-btn" data-tab="thee">The E</button>
      <button class="tab-btn" data-tab="addons">Add Ons</button>
      <button class="tab-btn" data-tab="chat">Message Admin</button>
    </div>

    <!-- 🧃 Product Sections -->
    <div id="signatures" class="tab-content active"></div>
    <div id="flavored" class="tab-content"></div>
    <div id="thee" class="tab-content"></div>
    <div id="addons" class="tab-content"></div>

    <!-- 💬 Chat Section -->
    <div id="chat" class="tab-content">
      <div id="chat-messages" class="chat-box"></div>
      <div class="chat-input">
        <input type="text" id="message-text" placeholder="I-type ang mensahe mo...">
        <button id="send-msg-btn">Ipadala</button>
      </div>
    </div>

    <!-- 🛒 Cart -->
    <div class="cart">
      <h3>🧾 Iyong Order</h3>
      <div id="cart-items"></div>
      <p class="total">Kabuuan: ₱<span id="total-amount">0</span></p>
      <button id="submit-order" class="submit-btn">Ipadala ang Order</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
